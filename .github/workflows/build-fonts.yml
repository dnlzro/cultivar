name: Build Fonts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - sources/**
      - scripts/**
      - requirements.txt
      - .github/workflows/build-fonts.yml
  pull_request:
    branches:
      - main
    paths:
      - sources/**
      - scripts/**
      - requirements.txt
      - .github/workflows/build-fonts.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Fonts
    steps:
      - name: Check out Cultivar source repository
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
      - name: Build fonts
        run: |
          gftools builder sources/config.yaml
          python scripts/generate_variable_webfonts.py
      - name: Upload Fonts
        uses: actions/upload-artifact@v7
        with:
          name: Fonts
          path: fonts/
          if-no-files-found: error

  release:
    # Path filters are not evaluated for tag pushes, so every v* tag gets a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write
    steps:
      - name: Download Fonts
        uses: actions/download-artifact@v8
        with:
          name: Fonts
          path: fonts/
      - name: Package fonts
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -r "Cultivar-${version}.zip" fonts/
          echo "ZIP_NAME=Cultivar-${version}.zip" >> "$GITHUB_ENV"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
